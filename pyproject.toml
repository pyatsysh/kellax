[project]
name = "kellax"
dynamic = ["version"]
description = "Pseudo-arclength (Keller) continuation and bordered Newton solvers in JAX: trace solution branches of R(x, p) = 0 through folds with autodiff Jacobians; Moore-Spence fold refinement and two-parameter fold tracking; generic bordered constraints; roadmap to differentiable continuation."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Peter Yatsyshin"}]
dependencies = [
    "numpy>=2.0",
    "jax>=0.4",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.7"]          # figures for examples/ and book/
spectra = ["scipy>=1.10"]               # Lanczos in kellax.hessian; see below
test = ["pytest>=7", "scipy>=1.10"]
dev = ["matplotlib>=3.7", "pytest>=7", "scipy>=1.10"]

# scipy is declared rather than assumed. kellax imports it lazily, in
# kellax.hessian only, so the core install stays numpy + jax; but jax has
# always happened to pull scipy in as a hard dependency of its own, which
# meant the spectrum functions and their tests passed on borrowed weight and
# would have broken the day jax dropped it, with nothing of ours having moved.

[project.urls]
Repository = "https://github.com/pyatsysh/kellax"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "kellax.__version__"}   # single source of truth: kellax/__init__.py

[tool.setuptools.packages.find]
include = ["kellax*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
